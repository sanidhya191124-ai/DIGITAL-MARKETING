<!DOCTYPE html>
<html>
<head>
    <title>Simple Table</title>
</head>
<body>

    <!-- Beginning of the table with all your attributes -->
    <table border="5" bgcolor="green"  cellspacing="10" cellpadding="15" width="400" height="200">
        
        <!-- Table Row 1 (Headers) -->
        <tr>
            <th>Subject</th>
            <th>Marks</th>
        </tr>
        
        <!-- Table Row 2 (Data) -->
        <tr>
            <td>Maths</td>
            <td>95</td>
        </tr>
        
        <!-- Table Row 3 (Data) -->
        <tr>
            <td>Science</td>
            <td>33</td>
        </tr>

          <!-- Table Row 3 (Data) -->
        <tr>
            <td>Dbms</td>
            <td>28</td>
        </tr>

    </table>
    <!-- End of the table -->

</body>
</html>
