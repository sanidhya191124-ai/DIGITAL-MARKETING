<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Styling Example</title>
    <!-- This line connects your HTML file to your external CSS file -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- This heading uses an inline style, which overrides external CSS -->
    <h1 style="color: blue;">Only this heading will have blue colour (using inline style)</h1> 

    <!-- This heading will use the global style defined in your styles.css file -->
    <h1>This paragraph will be in red (external style).</h1>

</body>
</html>
